<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><title>เข้าสู่ระบบ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content">
  <div class="card">
    <h2>เข้าสู่ระบบ</h2>
    <label>รหัสผู้ใช้งาน</label>
    <input id="supId" placeholder="เช่น S001 หรือ A001">
    <label>รหัสผ่าน</label>
    <input id="password" type="password">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <p class="msg" id="msg"></p>
  </div>
  </div>
  <script>
    async function login() {
      const supervisor_id = document.getElementById('supId').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ supervisor_id, password })
      });
      const data = await res.json();
      const msg = document.getElementById('msg');
      if (res.ok) window.location.href = '/index.html';
      else { msg.className = 'msg error'; msg.innerText = data.error; }
    }
  </script>
</body>
</html>
