<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><title>ประวัติการลา</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content">
    <div class="card wide">
      <h2>ประวัติการลา (Admin)</h2>
      <div class="filters">
        <div><label>ตั้งแต่วันที่</label><input id="dateFrom" type="date"></div>
        <div><label>ถึงวันที่</label><input id="dateTo" type="date"></div>
        <div><label>ชื่อพนักงาน</label><input id="filterName"></div>
        <div><label>บริษัท</label><input id="filterCompany"></div>
        <div><label>แผนก</label><input id="filterDept"></div>
      </div>
      <button onclick="search()">ค้นหา</button>
      <p class="msg" id="msg"></p>
      <table>
        <thead>
        <tr><th>ชื่อ</th><th>บริษัท</th><th>แผนก</th>
        <th>วันที่เริ่ม/เวลา</th><th>ถึงวันที่/เวลา</th>
        <th>ประเภทการลา</th><th>จำนวนวันที่ใช้ไป</th><th>รูปภาพ</th>
        </tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    async function search() {
      const params = new URLSearchParams({
        date_from: document.getElementById('dateFrom').value,
        date_to: document.getElementById('dateTo').value,
        name: document.getElementById('filterName').value,
        company: document.getElementById('filterCompany').value,
        department: document.getElementById('filterDept').value
      });
      const res = await fetch('/api/attendance/leave/history?' + params.toString());
      const msg = document.getElementById('msg');
      if (res.status === 403) { msg.className = 'msg error'; msg.innerText = 'หน้านี้สำหรับ admin เท่านั้น'; return; }
      const records = await res.json();
      document.getElementById('resultBody').innerHTML = records.map(r => `
        <tr><td>${r.name}</td><td>${r.company}</td><td>${r.department}</td>
        <td>${r.start_datetime}</td><td>${r.end_datetime}</td>
        <td>${r.leave_type}</td><td>${r.days_used} วัน</td>
        <td>${r.image_path ? `<a href="${r.image_path}" target="_blank"><button style="width:auto;margin-top:0;padding:6px 12px;font-size:13px;">ดูรูป</button></a>` : '-'}</td></tr>
        `).join('');
      msg.innerText = '';
    }

    (async () => {
      await renderNav('history.html');
      search();
    })();
  </script>
</body>
</html>
